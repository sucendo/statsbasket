function percentile(values,value,higher=true){

 let tabs='<div class="team-profile-tabs" role="tablist" aria-label="Ficha de equipo"><button type="button" class="team-profile-tab active" role="tab" aria-selected="true" data-team-profile-tab="datos">Datos</button><button type="button" class="team-profile-tab" role="tab" aria-selected="false" data-team-profile-tab="plantilla">Plantilla <span class="pill gray">'+players.length+'</span></button></div>';
 let datosGrid='<div class="team-profile-grid"><div class="team-profile-left">'+recentHtml+sedeCard+'</div>'+radar+'</div>';
 let panes='<section class="team-profile-pane" data-team-profile-pane="datos">'+kpis+datosGrid+'</section><section class="team-profile-pane" data-team-profile-pane="plantilla" hidden>'+roster+'</section>';
 $('detail-body').innerHTML=header+tabs+panes;
 if(!$('detail').open)$('detail').showModal()
}

function chooseHistoryMatches(target,season){
 const all=[];
 (season.teams||[]).filter(t=>!t.placeholder).forEach(t=>(t.players||[]).forEach(p=>all.push({team:t,player:p})));
 if(target.player.personId){
   const exact=all.filter(x=>x.player.personId&&x.player.personId===target.player.personId);
   if(exact.length)return exact;
 }
 const compatible=all.filter(x=>compatiblePlayerName(target.player.name,x.player.name));
 const sameTeam=compatible.filter(x=>teamIdentity(x.team.name)===teamIdentity(target.team.name));
 const targetKey=playerSignature(target.player.name).publicKey;
 if(sameTeam.length){
   const exact=sameTeam.filter(x=>playerSignature(x.player.name).publicKey===targetKey);
   if(exact.length)return exact;
   if(sameTeam.length===1)return sameTeam;
   const raw=new Set(sameTeam.map(x=>normIdentity(x.player.name)));
   return raw.size===1?sameTeam:[]
 }
 const globalExact=compatible.filter(x=>playerSignature(x.player.name).publicKey===targetKey);
 if(globalExact.length===1)return globalExact;
 if(compatible.length===1)return compatible;
 const surnameSameTeam=all.filter(x=>teamIdentity(x.team.name)===teamIdentity(target.team.name)&&compatibleSurnamePrefix(target.player.name,x.player.name));
 if(surnameSameTeam.length===1)return surnameSameTeam;
 return []
}
function mergePlayerStats(records){
 const out={...blank(),gp:0},keys=['pts','t2m','t2a','t3m','t3a','tlm','tla','reb','rebO','rebD','ast','stl','blk','blkAgainst','tov','foul','foulDrawn','seconds','plusMinus'];
 let hasVal=false,val=0;
 records.forEach(r=>{out.gp+=N(r.gp);keys.forEach(k=>out[k]+=N(r[k]));if(r.officialVal!=null){hasVal=true;val+=N(r.officialVal)}});
 out.officialVal=hasVal?val:null;
 return out
}
async function loadHistorySeason(label,url){
 if(historyCache.has(url))return historyCache.get(url);
 const promise=fetch(url,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(url);return r.json()}).then(raw=>normalizeLegacy(raw,label)).catch(()=>null);
 historyCache.set(url,promise);
 return promise
}
async function allPlayerHistorySeasons(){
 const hist=await Promise.all(legacy.map(x=>loadHistorySeason(x[0],x[1])));
 const by=new Map();
 [...publishedSeasons,...hist.filter(Boolean)].forEach(s=>{if(s?.season)by.set(String(s.season)+'|'+String(s.competition||''),s)});
 return [...by.values()]
}
function historyStatCells(s,partial){
 if(!partial)return statCells(s,true);
 let gp=N(s.gp),dash='<td class="num">—</td>';
 return '<td class="num">'+gp+'</td>'+dash+'<td class="num bold">'+N(s.pts)+'</td><td class="num">'+(gp?(N(s.pts)/gp).toFixed(1):'0.0')+'</td>'+dash.repeat(14)+'<td class="num">'+N(s.foul)+'</td>'+dash.repeat(3)
}
function historyTotal(rows){
 const out={...blank(),gp:0};let hasVal=false,val=0;
 rows.forEach(r=>{let s=r.stats;out.gp+=N(s.gp);['pts','t2m','t2a','t3m','t3a','tlm','tla','reb','rebO','rebD','ast','stl','blk','blkAgainst','tov','foul','foulDrawn','seconds','plusMinus'].forEach(k=>out[k]+=N(s[k]));if(s.officialVal!=null){hasVal=true;val+=N(s.officialVal)}});
 out.officialVal=hasVal?val:null;return out
}
async function playerHistoryDetail(playerId,teamId){
 const teamObj=active?.teams?.find(t=>t.id===teamId),player=teamObj?.players?.find(p=>p.id===playerId);
 if(!teamObj||!player)return;
 const target={team:teamObj,player};
 $('detail-title').textContent=playerDisplayName(player)+' · Historial';
 $('detail-body').innerHTML='<div class="empty">Buscando todas las temporadas…</div>';
 if(!$('detail').open)$('detail').showModal();
 const seasons=await allPlayerHistorySeasons(),rows=[];
 seasons.forEach(s=>{
   const matches=chooseHistoryMatches(target,s);if(!matches.length)return;
   const allStats=stats(s,s.games),records=matches.map(m=>allStats.players.find(x=>x.player.id===m.player.id)).filter(Boolean);
   const merged=mergePlayerStats(records),teams=[...new Set(matches.map(m=>m.team.name))],numbers=[...new Set(matches.map(m=>String(m.player.number??'—')))];
   rows.push({season:String(s.season),competition:String(s.competition||''),teams,numbers,stats:merged,partial:s.statsAvailability==='acta-partial',names:[...new Set(matches.map(m=>playerDisplayName(m.player)))]});
 });
 rows.sort((a,b)=>b.season.localeCompare(a.season,undefined,{numeric:true}));
 const total=historyTotal(rows);
 const head=[['Temporada'],['Equipo'],['N.'],['PJ','num'],['MIN','num'],['PTS','num'],['PPP','num'],['T2','num'],['T2%','num'],['T3','num'],['T3%','num'],['TL','num'],['TL%','num'],['RD','num'],['RO','num'],['REB','num'],['AST','num'],['REC','num'],['PÉR','num'],['TAP','num'],['TR','num'],['FC','num'],['FR','num'],['VAL','num'],['+/-','num']];
 const body=rows.map(r=>'<tr><td class="bold">'+E(r.season)+'</td><td>'+E(r.teams.join(' / '))+'</td><td>'+E(r.numbers.join(' / '))+'</td>'+historyStatCells(r.stats,r.partial)+'</tr>').join('');
 const totalRow='<tr class="team-total"><th colspan="3">TOTAL REGISTRADO</th>'+statCells(total,true)+'</tr>';
 const summary='<div class="career-summary"><div class="career-stat"><strong>'+rows.length+'</strong><span>Temporadas</span></div><div class="career-stat"><strong>'+N(total.gp)+'</strong><span>Partidos</span></div><div class="career-stat"><strong>'+N(total.pts)+'</strong><span>Puntos</span></div><div class="career-stat"><strong>'+N(total.reb)+'</strong><span>Rebotes</span></div><div class="career-stat"><strong>'+N(total.ast)+'</strong><span>Asistencias</span></div></div>';
 const note='<p class="career-note">La identidad histórica no depende del dorsal. Para datos antiguos sin identificador personal estable, StatsBasket enlaza únicamente coincidencias de nombre suficientemente claras; si una coincidencia es ambigua, no mezcla jugadores distintos. Las temporadas procedentes de actas oficiales muestran únicamente participación, puntos y faltas; las columnas no registradas aparecen como —. El total de las demás columnas suma solo los datos que existen en las temporadas que sí los registran.</p>';
 $('detail-body').innerHTML='<h3 class="match-team-title">'+E(playerDisplayName(player))+'</h3>'+summary+(rows.length?table(head,body+totalRow):'<p class="muted">No hay estadísticas históricas identificables para este jugador.</p>')+note
}
function detail(id){
 let g=active.games.find(x=>x.id===id);if(!g)return;let a=tBy(g.teamIds[0]),b=tBy(g.teamIds[1]);
 $('detail-title').textContent=a.name+' – '+b.name;
 let header='<div class="match match-summary" style="margin-bottom:16px"><div>'+team(a)+'</div><span class="score">'+(g.status==='final'?g.score.map(N).join(' : '):'— : —')+'</span><div>'+team(b)+'</div></div><p class="muted small">'+E(fmt(g.date))+' · '+E(g.time||'')+(g.venue?' · '+E(g.venue):'')+(g.acta?' · Acta '+E(g.acta):'')+'</p>';
 if(actaGame(g)){
  $('detail-body').innerHTML=header+actaPlayerTable(a,g)+actaPlayerTable(b,g)+'<p class="career-note">Acta oficial FBM: se han extraído participación, puntos y faltas personales. Estas actas no registran minutos, rebotes, asistencias, recuperaciones, pérdidas, desglose de tiros, valoración ni +/-.</p>'
 }else{
  let one=stats({...active,games:[g]},[g]),players=one.players.filter(p=>p.gp>0),ta=one.teams.find(t=>t.team.id===a.id),tb=one.teams.find(t=>t.team.id===b.id),pa=players.filter(p=>p.team.id===a.id).sort((x,y)=>N(x.player.number)-N(y.player.number)),pb=players.filter(p=>p.team.id===b.id).sort((x,y)=>N(x.player.number)-N(y.player.number));
  $('detail-body').innerHTML=header+((pa.length||pb.length)?matchPlayerTable(a,pa,ta)+matchPlayerTable(b,pb,tb):'<p class="muted">Este partido no tiene estadísticas individuales disponibles.</p>')+'<p class="muted small">MIN: minutos · RD/RO: rebotes defensivos/ofensivos · REC: recuperaciones · PÉR: pérdidas · TAP/TR: tapones realizados/recibidos · FC/FR: faltas cometidas/recibidas · VAL: valoración · +/-: más/menos.</p>'
 }
 if(!$('detail').open)$('detail').showModal()
}
function render(){if(!active)return;$('source').textContent=active.source==='legacy'?(active.partial?'Histórico parcial':'Archivo histórico'):'Temporada actual';let actaMsg=active.actaStatsCount?' <b>'+active.actaStatsCount+' actas oficiales</b> incluyen estadísticas individuales de participación, puntos y faltas.':'';let legacyNotice=active.partial?'<div class="notice"><b>Archivo parcial.</b> Esta temporada contiene los partidos aportados de Begoña Bulls ('+filtered().filter(g=>g.status==='final').length+' partidos). La clasificación se calcula solo con estos encuentros y no representa necesariamente la clasificación completa de la liga.'+actaMsg+'</div>':'<div class="notice">Archivo histórico: se conservan los registros originales. Algunas temporadas no contienen todas las categorías estadísticas.'+actaMsg+'</div>';$('notice').innerHTML=active.source==='legacy'?legacyNotice:(active.season==='2026-2027'?'<div class="notice">Parish League 2026-2027: calendario integrado. Los encuentros con acta importada incluyen estadísticas de jugador y equipo.</div>':'');$('screen').innerHTML=tab==='inicio'?renderHome():tab==='resultados'?renderResults():tab==='clasificacion'?renderStand():tab==='jugadores'?renderPlayers():tab==='equipos'?renderTeams():tab==='partidos'?renderFinishedGames():renderLeaders()}
async function select(id){let src=sources.find(s=>s.id===id);if(!src)return;$('screen').innerHTML='<div class="panel empty">Cargando temporada…</div>';try{if(src.data)active=src.data;else{let r=await fetch(src.url);if(!r.ok)throw Error('No se pudo cargar '+src.url);active=normalizeLegacy(await r.json(),src.id)}competition='all';let comps=[...new Set(active.games.map(g=>g.competition).filter(Boolean))].sort();$('competition').innerHTML='<option value="all">Todas</option>'+comps.map(c=>'<option>'+E(c)+'</option>').join('');render()}catch(e){$('screen').innerHTML='<div class="panel empty">No se pudo cargar la temporada: '+E(e.message)+'</div>'}}
async function start(){
 let current=[];
 try{let r=await fetch('data/nombres-publicos.json?t='+Date.now(),{cache:'no-store'});if(r.ok)publicNames=await r.json()}catch(e){publicNames={person:{},ficha:{},current:{}}}
 try{let rs=await Promise.all(ACTA_FILES.map(url=>fetch(url+'?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null)));actaHistory=rs.filter(Boolean).flatMap(j=>j.matches||[])}catch(e){actaHistory=[]}
 try{let r=await fetch('data/publicado.json?t='+Date.now(),{cache:'no-store'}),j=await r.json();publishedSeasons=(j.seasons||[]).map(s=>canonicalizePublishedSeason(s));current=publishedSeasons.map((s,i)=>({id:'published-'+i,label:s.season+' · '+s.competition,data:s}))}catch(e){}
 sources=[...current,...legacy.map(x=>({id:x[0],label:x[0]+' · Histórico',url:x[1]}))];$('season').innerHTML=sources.map(s=>'<option value="'+E(s.id)+'">'+E(s.label)+'</option>').join('');if(sources.length)select(sources[0].id)
}
function goToTab(next){tab=next;document.querySelectorAll('.main-nav [data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));render();window.scrollTo({top:0,behavior:'smooth'})}
document.addEventListener('click',e=>{let p=e.target.closest('[data-player]');if(p){playerHistoryDetail(p.dataset.player,p.dataset.playerTeam);return}let teamTab=e.target.closest('[data-team-profile-tab]');if(teamTab){let key=teamTab.dataset.teamProfileTab,body=teamTab.closest('.dialog-body');body?.querySelectorAll('[data-team-profile-tab]').forEach(b=>{let on=b.dataset.teamProfileTab===key;b.classList.toggle('active',on);b.setAttribute('aria-selected',on?'true':'false')});body?.querySelectorAll('[data-team-profile-pane]').forEach(pane=>pane.hidden=pane.dataset.teamProfilePane!==key);return}let cmp=e.target.closest('[data-compare-players]');if(cmp){comparePlayersDetail();return}let game=e.target.closest('#detail [data-game]');if(game){detail(game.dataset.game);return}let goto=e.target.closest('[data-goto]');if(goto){e.preventDefault();goToTab(goto.dataset.goto);return}let s=e.target.closest('.sort-btn');if(s)sortStatsTable(s)});
$('season').addEventListener('change',e=>select(e.target.value));$('competition').addEventListener('change',e=>{competition=e.target.value;render()});document.querySelectorAll('.main-nav [data-tab]').forEach(b=>b.addEventListener('click',()=>goToTab(b.dataset.tab)));$('screen').addEventListener('click',e=>{let teamBtn=e.target.closest('[data-team]');if(teamBtn){teamPlayersDetail(teamBtn.dataset.team);return}let b=e.target.closest('[data-game]');if(b)detail(b.dataset.game)});$('close').addEventListener('click',()=>$('detail').close());start();
